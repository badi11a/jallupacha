name: Frontend base quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.12.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check:source --workspace frontend
      - run: npm test --workspace frontend
      - run: npm run check:contrast --workspace frontend
      - run: npm run build --workspace frontend
      - run: npm run test:base --workspace frontend
      - run: npm audit --workspace frontend --audit-level=high
      - name: Generate independent neutral consumer
        run: node frontend/tools/create-starter.mjs --output "$RUNNER_TEMP/frontend-consumer"
      - name: Verify consumer installation, tests and compilation
        working-directory: ${{ runner.temp }}/frontend-consumer
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm audit --audit-level=high
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@107a41827bb6698dbbff756b2300537774a1d84c
      - name: Scan tracked history with redacted output
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: .github/codeql/frontend.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          output: sarif
          upload: never
          upload-database: false
          wait-for-processing: false
      - name: Block high and critical findings
        run: node frontend/tools/check-sarif.mjs sarif
