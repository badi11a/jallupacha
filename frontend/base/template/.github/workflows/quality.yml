name: Frontend quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.12.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check:source
      - run: npm run check:contrast
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: go install github.com/zricethezav/gitleaks/v8@107a41827bb6698dbbff756b2300537774a1d84c
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          output: sarif
          upload: never
          upload-database: false
          wait-for-processing: false
      - run: node tools/check-sarif.mjs sarif
